upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Hide server version
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Backend auth endpoints (FastAPI owns these — must win over the /api/auth/
    # block below because exact-match locations beat prefix locations in nginx).
    location = /api/auth/login                  { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }
    location = /api/auth/logout                 { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }
    location = /api/auth/me                     { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }
    location = /api/auth/reset-password         { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }
    location = /api/auth/reset-password/confirm { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }

    # Everything else under /api/auth/ is next-auth (session, csrf, providers,
    # callback/:provider, signin, signout, error) — serve from the Next.js app.
    location /api/auth/ {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/_proxy_common.conf;
    }

    # All other API routes to backend
    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/_proxy_common.conf;
        proxy_read_timeout 60s;
    }

    # Everything else to Next.js
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/_proxy_common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
