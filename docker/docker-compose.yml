services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fnu
      POSTGRES_PASSWORD: fnu_dev_password
      POSTGRES_DB: fnu_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnu -d fnu_portal"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fnu:fnu_dev_password@postgres:5432/fnu_portal
      BANNER_MODE: mock
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: "http://backend:8000"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-dev-nextauth-secret-change-me-32-plus-chars-xxxxxxxxxx}"
    env_file:
      - path: ../.env
        required: false
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./_proxy_common.conf:/etc/nginx/conf.d/_proxy_common.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
