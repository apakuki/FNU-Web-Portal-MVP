upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# Redirect HTTP -> HTTPS, except ACME challenge (so Let's Encrypt can renew).
server {
    listen 80;
    server_name portal.fnu.ac.fj;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name portal.fnu.ac.fj;

    # TLS certs — provisioned by certbot into ./certs at deployment time.
    ssl_certificate     /etc/nginx/certs/live/portal.fnu.ac.fj/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/portal.fnu.ac.fj/privkey.pem;

    # Modern TLS profile (Mozilla "intermediate", 2026).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 10M;
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Backend auth endpoints (FastAPI)
    location = /api/auth/login                  { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }
    location = /api/auth/logout                 { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }
    location = /api/auth/me                     { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }
    location = /api/auth/reset-password         { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }
    location = /api/auth/reset-password/confirm { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy_common.conf; }

    # next-auth lives under /api/auth/ (session, csrf, providers, callback, signin/out, error)
    location /api/auth/ {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/_proxy_common.conf;
    }

    # All other API routes to backend
    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/_proxy_common.conf;
        proxy_read_timeout 60s;
    }

    # Next.js
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/_proxy_common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
